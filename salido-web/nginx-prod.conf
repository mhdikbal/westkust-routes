# /etc/nginx/conf.d/salido.conf
# Host Nginx — salido.my.id production
# Cloudflare Origin Certificate (15 tahun, tidak perlu renewal)

server {
    listen 80;
    server_name salido.my.id www.salido.my.id;
    # Cloudflare handles HTTP→HTTPS redirect di edge
    # Tapi tetap redirect di origin untuk akses langsung
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name salido.my.id www.salido.my.id;

    # ── Cloudflare Origin Certificate ────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/salido/dist;
    index index.html;

    # ── Westkust API — proxy ke voc_nginx Docker ──────────────────────────
    # /api/ harus SEBELUM / supaya tidak di-serve sebagai static file
    location /api/ {
        proxy_pass http://127.0.0.1:8084/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    # ── Westkust app — proxy ke voc_nginx Docker ─────────────────────────
    location /westkust/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60;

        # Rewrite absolute URLs dari Django agar cocok dengan /westkust/ prefix
        sub_filter_once off;
        sub_filter 'href="/'  'href="/westkust/';
        sub_filter "href='/"  "href='/westkust/";
        sub_filter 'src="/'   'src="/westkust/';
        sub_filter "src='/"   "src='/westkust/";
    }

    # ── Favicon — no-cache agar browser selalu ambil versi terbaru ────────
    location = /favicon.ico {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # ── Astro static site ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html /index.html;

        # Cache static assets — ico dikecualikan (ada block terpisah di atas)
        location ~* \.(jpg|jpeg|png|gif|svg|webp|woff2|woff|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
