# /etc/ssh/sshd_config.d/10-hardening.conf
# Dibuat: 2026-06-29
#
# Diload SEBELUM 50-cloud-init.conf (first match wins di OpenSSH).
# 50-cloud-init.conf berisi PasswordAuthentication yes — file ini override-nya.
#
# Deploy: sudo cp 10-hardening.conf /etc/ssh/sshd_config.d/ && sudo systemctl reload ssh

PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
