
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: voc_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocdb}
      POSTGRES_USER: ${POSTGRES_USER:-vocuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocuser} -d ${POSTGRES_DB:-vocdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voc_redis
    restart: always
    # Cache-aside ADR-001: cap 128MB (VPS 2GB), LRU. Internal network saja —
    # tidak ada ports ke host.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voc_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vocdb}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-vocuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vocdb}
      # Alias nama yang dipakai test integrasi US-06 + alembic (fallback
      # hardcoded-nya di-scrub saat US-07, jadi env ini wajib ada)
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-vocuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vocdb}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8084}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./scrawling:/app/scrawling
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Port 8000 tidak di-expose ke host — nginx dan frontend menjangkau backend
    # via Docker internal network (container name 'backend:8000').
    # Untuk debug langsung: docker compose exec backend curl localhost:8000/docs
    expose:
      - "8000"
    command: >
      sh -c "python seed_data.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voc_frontend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
    depends_on:
      - backend
    # SEC-1: port 8001 TIDAK di-publish ke host — akses hanya via nginx :8084
    # (publish langsung mem-bypass CSP/rate-limit dan mengekspos dev server).
    expose:
      - "8001"
    command: >
      sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8001"

  astro-linimasa:
    build:
      context: ./frontend/astro-linimasa
      dockerfile: Dockerfile
    container_name: voc_astro_linimasa
    restart: always
    environment:
      PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    expose:
      - "4321"

  nginx:
    image: nginx:1.25-alpine
    container_name: voc_nginx
    restart: always
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - astro-linimasa

volumes:
  pgdata:
