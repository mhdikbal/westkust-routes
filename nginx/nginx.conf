events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting — US-14 ────────────────────────────────────────────────
    # 10 MB zone ≈ 160 000 unique IPs. Rate: 60 req/menit per IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # ── Dynamic DNS resolution — NGX-1 ───────────────────────────────────
        # Blok upstream{} statis me-resolve IP container hanya saat nginx start.
        # Setelah `docker compose up -d --build backend|frontend`, container baru
        # dapat IP baru → nginx masih memakai IP lama → 502 sampai restart manual.
        # Solusi: resolver Docker embedded DNS (127.0.0.11) + proxy_pass berbentuk
        # variable, sehingga nama service di-resolve ulang per request (TTL 10s).
        # CATATAN semantik: proxy_pass dengan variable TANPA URI meneruskan
        # request URI asli apa adanya (termasuk query string) — itulah yang
        # diinginkan semua location di bawah.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ── HTTP/2 — US-15 ───────────────────────────────────────────────────
        # Nginx 1.25+ syntax: http2 on (berlaku untuk semua listen di server ini).
        # Atas plain HTTP, browser tidak menegosiasikan h2 (butuh TLS).
        # Config ini sudah siap — h2 otomatis aktif saat TLS ditambahkan (US-13).
        http2 on;

        # ── HTTP/3 / QUIC — persiapan untuk US-13 (HTTPS) ───────────────────
        # HTTP/3 membutuhkan TLS + UDP port 443. Aktifkan setelah sertifikat tersedia:
        #
        # listen 443 quic reuseport;
        # listen 443 ssl;
        # http3 on;
        # ssl_certificate     /etc/letsencrypt/live/domain/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/domain/privkey.pem;
        # add_header Alt-Svc 'h3=":443"; ma=86400' always;
        #
        # Setelah aktif, browser akan upgrade ke HTTP/3 via Alt-Svc header.

        # ── Security headers — US-15 ─────────────────────────────────────────
        # Semua header di server block berlaku ke seluruh location.
        # PERHATIAN: location yang punya add_header sendiri TIDAK mewarisi blok ini.
        # Location yang ada add_header-nya sendiri (seperti /rate_limited) harus
        # menyertakan ulang security headers yang diperlukan.

        # Cegah clickjacking via iframe
        add_header X-Frame-Options "DENY" always;

        # Cegah MIME-type sniffing (browser tidak boleh menebak Content-Type)
        add_header X-Content-Type-Options "nosniff" always;

        # Kontrol informasi referrer ke situs eksternal
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Batasi akses JS ke API browser sensitif (kamera, mikrofon, GPS)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # Content Security Policy — sesuai CDN yang dipakai atlas:
        #   script-src : Leaflet (unpkg), Chart.js + leaflet-ant-path + Tabler (jsdelivr)
        #   style-src  : Google Fonts CSS, Leaflet CSS, Tabler Icons CSS + 'unsafe-inline'
        #                (butuh unsafe-inline karena <style> block di template)
        #   font-src   : Google Fonts binary (gstatic) + Tabler Icons font (jsdelivr)
        #   img-src    : CARTO map tiles (basemaps.cartocdn.com), data: URI untuk marker
        #   connect-src: 'self' saja — semua /api/ fetch sudah same-origin via Nginx
        #   frame-ancestors: none — tidak boleh di-embed di iframe manapun
        # TODO (setelah US-11 onclick cleanup): hilangkan 'unsafe-inline' dari script-src
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Custom JSON 429 ──────────────────────────────────────────────────
        # CATATAN: location ini punya add_header sendiri (Retry-After) sehingga
        # security headers dari server block tidak diwariskan. Header wajib
        # di-set ulang di sini agar response 429 tetap aman.
        error_page 429 /rate_limited;
        location = /rate_limited {
            internal;
            default_type application/json;
            add_header Retry-After 60 always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"error":"rate_limit_exceeded","message":"Terlalu banyak permintaan. Coba lagi dalam 60 detik.","retry_after":60}';
        }

        # ── API requests → FastAPI backend (rate limited) ────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }

        # ── API docs (rate limited) ──────────────────────────────────────────
        location /docs {
            limit_req zone=api_limit burst=5 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_read_timeout 60;
        }

        location /openapi.json {
            limit_req zone=api_limit burst=5 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        # ── Frontend — tidak di-rate-limit ───────────────────────────────────
        location / {
            # Sembunyikan security headers dari Django/WhiteNoise agar
            # tidak duplikat dengan header yang sudah di-set Nginx di atas.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-XSS-Protection;

            set $frontend_upstream http://frontend:8001;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }
    }
}
