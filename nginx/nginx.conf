events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting — US-14 ────────────────────────────────────────────────
    # 10 MB zone ≈ 160 000 unique IPs. Rate: 60 req/menit per IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # Custom JSON 429 — API consumers butuh machine-readable error, bukan HTML default Nginx
        error_page 429 /rate_limited;
        location = /rate_limited {
            internal;
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":"rate_limit_exceeded","message":"Terlalu banyak permintaan. Coba lagi dalam 60 detik.","retry_after":60}';
        }

        # API requests → FastAPI backend (rate limited)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }

        # API docs (rate limited, same zone)
        location /docs {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_read_timeout 60;
        }

        location /openapi.json {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend — tidak di-rate-limit (static assets dan HTML)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
        }
    }
}
