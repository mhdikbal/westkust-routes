[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salido-hdt"
version = "0.1.0"
description = "CP-SAT solver and tooling over the SALIDO-HDT enclave dataset (docs/enclave/)"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/salido_hdt"]
addopts = "--import-mode=importlib"
